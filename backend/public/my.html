<!doctype html>
<html lang="uk">
<head>
  <script src="/p/tenant-boot.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мій кабінет — SVS Beauty Space</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; }
  .tab { padding: 10px 18px; border-bottom: 2px solid transparent; cursor:pointer; color:#64748b; font-weight:500 }
  .tab.active { border-color:#0f172a; color:#0f172a }
  .star { color:#f59e0b; font-size:18px }
  .star.dim { color:#e5e7eb }
  .fav-icon { color:#ef4444 }
</style>
</head>
<body class="bg-slate-50 min-h-screen">

<header class="bg-white border-b">
  <div class="max-w-3xl mx-auto px-6 py-5 flex justify-between items-center">
    <a href="https://mirbirkof.github.io/svs-beauty-space/" class="text-xl font-bold">SVS Beauty Space</a>
    <nav class="text-sm flex gap-5">
      <a href="/p/promotions.html" class="text-slate-600 hover:text-slate-900">Акції</a>
      <a href="/p/my.html" class="text-slate-900 font-semibold">Кабінет</a>
    </nav>
  </div>
</header>

<main class="max-w-3xl mx-auto px-6 py-8">

<!-- LOGIN -->
<section id="login" class="bg-white rounded-2xl shadow-sm p-6">
  <h1 class="text-2xl font-bold mb-1">Личный кабинет</h1>
  <p class="text-sm text-slate-500 mb-5">Введите телефон — пришлём код подтверждения, и вы увидите свои визиты, избранное и отзывы</p>
  <input id="phone" type="tel" placeholder="+380XXXXXXXXX" class="w-full border rounded-xl px-4 py-3 text-lg">
  <button id="btn-code" onclick="requestCode()" class="w-full bg-slate-900 text-white rounded-xl py-3 mt-4 font-semibold">Получить код</button>
  <div id="code-box" class="hidden mt-4">
    <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="Код из сообщения" class="w-full border rounded-xl px-4 py-3 text-lg tracking-widest text-center">
    <button onclick="enter()" class="w-full bg-slate-900 text-white rounded-xl py-3 mt-3 font-semibold">Войти</button>
  </div>
  <p id="login-msg" class="text-sm mt-3 text-slate-500"></p>
</section>

<!-- PROFILE -->
<section id="profile" class="hidden">
  <div class="bg-white rounded-2xl shadow-sm p-6 mb-4">
    <div class="flex justify-between items-center">
      <div>
        <p class="text-xs uppercase text-slate-500">Кабинет клиента</p>
        <h1 id="myPhone" class="text-xl font-bold"></h1>
      </div>
      <button onclick="logout()" class="text-sm text-slate-500 hover:text-slate-900">Выйти</button>
    </div>
  </div>

  <div class="bg-white rounded-2xl shadow-sm">
    <div class="flex border-b">
      <div class="tab active" data-tab="history">История</div>
      <div class="tab" data-tab="favorites">Избранное</div>
      <div class="tab" data-tab="reviews">Мои отзывы</div>
    </div>

    <!-- HISTORY -->
    <div id="t-history" class="p-6">
      <div id="hist-list" class="text-slate-500">Загрузка…</div>
    </div>

    <!-- FAVORITES -->
    <div id="t-favorites" class="hidden p-6">
      <div class="flex gap-2 mb-4">
        <select id="fav-kind" class="border rounded-lg px-3 py-1.5 text-sm">
          <option value="">Всё</option>
          <option value="master">Мастера</option>
          <option value="service">Услуги</option>
          <option value="product">Товары</option>
        </select>
        <button onclick="loadFavs()" class="bg-slate-900 text-white px-4 py-1.5 rounded-lg text-sm">Показать</button>
      </div>
      <div id="fav-list" class="text-slate-500">Загрузка…</div>
    </div>

    <!-- REVIEWS -->
    <div id="t-reviews" class="hidden p-6">
      <button onclick="document.getElementById('new-review').classList.toggle('hidden')" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm mb-4">+ Оставить отзыв</button>
      <div id="new-review" class="hidden bg-emerald-50 border border-emerald-200 rounded-xl p-4 mb-4">
        <input id="rev-master" placeholder="ID мастера или имя" class="border rounded-lg px-3 py-2 text-sm w-full mb-2">
        <div class="flex gap-1 mb-2 text-2xl cursor-pointer" id="rev-stars">
          <span data-r="1">☆</span><span data-r="2">☆</span><span data-r="3">☆</span><span data-r="4">☆</span><span data-r="5">☆</span>
        </div>
        <textarea id="rev-text" placeholder="Ваш отзыв" class="border rounded-lg px-3 py-2 text-sm w-full mb-2" rows="3"></textarea>
        <label class="flex items-center gap-2 text-sm text-slate-600 mb-3"><input id="rev-anon" type="checkbox"> Анонимно</label>
        <button onclick="submitReview()" class="bg-slate-900 text-white px-4 py-2 rounded-lg text-sm">Опубликовать</button>
      </div>
      <div id="rev-list" class="text-slate-500">Загрузка…</div>
    </div>
  </div>
</section>

</main>

<script>
// 17.09: страница оживлена. Раньше вход был «введи любой телефон» — сервер такие запросы
// отклонял (401), и все три вкладки показывали пустоту. Теперь вход как в кабинете:
// телефон → код в Telegram → токен сессии; личные данные отдаются только своему владельцу.
const API_SHOP = location.origin;
const API_DIK  = location.origin;
const TOKEN_KEY = 'svs_session_token';
let token = localStorage.getItem(TOKEN_KEY) || '';
let myPhone = localStorage.getItem('myPhone') || '';
let myRating = 5;
const H = () => ({ 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) });
async function api(url, opts = {}) {
  const r = await fetch(API_SHOP + url, { ...opts, headers: { ...H(), ...(opts.headers || {}) } });
  if (r.status === 401) { logout(); return { ok: false, error: 'unauthorized' }; }
  return r.json().catch(() => ({ ok: false, error: 'bad-json' }));
}
const msg = (t, err) => { const el = document.getElementById('login-msg'); if (el) { el.textContent = t; el.className = 'text-sm mt-3 ' + (err ? 'text-red-600' : 'text-slate-500'); } };

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

if (token && myPhone) showProfile();

function normPhone(p) {
  const d = String(p||'').replace(/\D/g,'');
  if (d.length === 12 && d.startsWith('380')) return '+' + d;
  if (d.length === 10 && d.startsWith('0')) return '+38' + d;
  return p;
}

async function requestCode() {
  const p = normPhone(document.getElementById('phone').value);
  if (!p || p.replace(/\D/g,'').length < 10) { msg('Введите телефон в формате +380XXXXXXXXX', true); return; }
  msg('Отправляю код…');
  const r = await api('/api/cabinet/request-code', { method: 'POST', body: JSON.stringify({ phone: p }) });
  if (r.ok) {
    myPhone = p;
    document.getElementById('code-box').classList.remove('hidden');
    document.getElementById('btn-code').textContent = 'Отправить код ещё раз';
    msg(r.hint ? r.hint : 'Код отправлен в Telegram — введите его ниже');
  } else if (r.error === 'too-many-requests') {
    msg('Слишком часто. Подождите минуту и попробуйте снова', true);
  } else if (r.error === 'no-telegram') {
    msg('К этому номеру не привязан Telegram. Напишите боту записи — и код будет приходить', true);
  } else {
    msg('Не удалось отправить код: ' + (r.error || 'ошибка'), true);
  }
}

async function enter() {
  const code = (document.getElementById('code').value || '').trim();
  if (!code) { msg('Введите код из сообщения', true); return; }
  const r = await api('/api/cabinet/verify', { method: 'POST', body: JSON.stringify({ phone: myPhone, code }) });
  if (r.ok && r.token) {
    token = r.token;
    localStorage.setItem(TOKEN_KEY, token);
    localStorage.setItem('myPhone', myPhone);
    msg('');
    showProfile();
  } else {
    msg(r.error === 'bad-code' ? 'Неверный код' + (r.attempts_left != null ? ` (осталось попыток: ${r.attempts_left})` : '') : 'Не удалось войти: ' + (r.error || 'ошибка'), true);
  }
}

function logout() {
  try { api('/api/cabinet/logout', { method: 'POST' }); } catch (e) {}
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem('myPhone');
  token = ''; myPhone = '';
  location.reload();
}

function showProfile() {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('profile').classList.remove('hidden');
  document.getElementById('myPhone').textContent = myPhone;
  loadHistory();
  loadFavs();
  loadReviews();
}

// табы
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  ['history','favorites','reviews'].forEach(n => document.getElementById('t-'+n).classList.add('hidden'));
  document.getElementById('t-'+t.dataset.tab).classList.remove('hidden');
});

// stars в форме нового отзыва
document.querySelectorAll('#rev-stars span').forEach(s => s.onclick = () => {
  myRating = parseInt(s.dataset.r);
  document.querySelectorAll('#rev-stars span').forEach(x => x.textContent = parseInt(x.dataset.r) <= myRating ? '★' : '☆');
});

// === HISTORY === (визиты кабинета: будущие + прошедшие)
async function loadHistory() {
  const box = document.getElementById('hist-list');
  try {
    const r = await api('/api/cabinet/visits?limit=100');
    if (!r.ok) { box.innerHTML = '<p class="text-slate-500">Не удалось загрузить историю</p>'; return; }
    const all = [...(r.upcoming || []), ...(r.past || [])];
    if (!all.length) { box.innerHTML = '<p class="text-slate-500">Визитов пока нет</p>'; return; }
    box.innerHTML = all.map(x => {
      const when = x.starts_at ? new Date(x.starts_at).toLocaleString('ru-UA', { day: '2-digit', month: 'long', hour: '2-digit', minute: '2-digit' }) : '';
      const sum = x.price != null ? Math.round(Number(x.price)).toLocaleString('ru-UA') + '₴' : '';
      return `
      <div class="border-b py-3">
        <div class="flex justify-between gap-3">
          <div>
            <p class="font-medium">${escapeHtml(x.service_name || x.service || 'Визит')}</p>
            <p class="text-xs text-slate-500">${escapeHtml(when)}${x.master_name ? ' · ' + escapeHtml(x.master_name) : ''}</p>
          </div>
          <span class="text-sm whitespace-nowrap">${escapeHtml(sum)}</span>
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    box.innerHTML = '<p class="text-red-500 text-sm">Ошибка загрузки: ' + escapeHtml(e.message) + '</p>';
  }
}

// === FAVORITES === (по токену: свой список, телефон в запросе не нужен)
async function loadFavs() {
  const box = document.getElementById('fav-list');
  const kind = document.getElementById('fav-kind').value;
  const r = await api('/api/favorites' + (kind ? '?kind=' + encodeURIComponent(kind) : ''));
  if (!r || r.error) { box.innerHTML = '<p class="text-slate-500">Не удалось загрузить избранное</p>'; return; }
  if (!r.items?.length) { box.innerHTML = '<p class="text-slate-500">Избранного нет</p>'; return; }
  box.innerHTML = r.items.map(f => `
    <div class="flex justify-between items-center border-b py-3">
      <div>
        <p class="font-medium">${escapeHtml(f.target_name || f.target_id)}</p>
        <p class="text-xs text-slate-500">${f.kind==='master'?'Мастер':f.kind==='service'?'Услуга':'Товар'} · добавлено ${new Date(f.created_at).toLocaleDateString('ru-UA')}</p>
      </div>
      <button onclick="rmFav('${escapeHtml(f.kind)}','${escapeHtml(f.target_id)}')" class="text-red-500 text-sm hover:underline">Убрать</button>
    </div>
  `).join('');
}

async function rmFav(kind, target_id) {
  await api('/api/favorites', { method: 'DELETE', body: JSON.stringify({ kind, target_id }) });
  loadFavs();
}

// === REVIEWS ===
async function loadReviews() {
  const r = await api('/api/reviews?limit=200');
  const mine = (r.items||[]).filter(x => {
    // отзыв виден если телефон совпадает (но в API client_phone не возвращается из соображений приватности)
    // показываем все опубликованные с display_name содержащим окончание телефона
    const tail = myPhone.slice(-4);
    return x.display_name && x.display_name.includes(tail);
  });
  if (!mine.length) { document.getElementById('rev-list').innerHTML = '<p class="text-slate-500">Вы ещё не оставили отзывов</p>'; return; }
  document.getElementById('rev-list').innerHTML = mine.map(rv => `
    <div class="border-b py-3">
      <div class="flex justify-between mb-1">
        <span>${stars(rv.rating)}</span>
        <span class="text-xs text-slate-500">${new Date(rv.created_at).toLocaleDateString('ru-UA')}</span>
      </div>
      <p class="text-sm text-slate-600 mb-1">${escapeHtml(rv.master_name || rv.master_id) || 'Без мастера'}</p>
      <p class="text-sm">${escapeHtml(rv.text||'')}</p>
      ${rv.is_anonymous ? '<p class="text-xs text-amber-700 mt-1">📌 Опубликован анонимно</p>' : ''}
    </div>
  `).join('');
}

function stars(n) {
  let s = '';
  for (let i=1; i<=5; i++) s += `<span class="star ${i<=n?'':'dim'}">★</span>`;
  return s;
}

async function submitReview() {
  const body = {
    client_phone: myPhone,
    master_id: document.getElementById('rev-master').value.trim() || 'unknown',
    master_name: document.getElementById('rev-master').value.trim() || null,
    rating: myRating,
    text: document.getElementById('rev-text').value.trim(),
    is_anonymous: document.getElementById('rev-anon').checked
  };
  if (!body.text) { alert('Напишите отзыв'); return; }
  const r = await api('/api/reviews', { method: 'POST', body: JSON.stringify(body) });
  if (r.ok) {
    document.getElementById('rev-text').value = '';
    document.getElementById('rev-master').value = '';
    document.getElementById('rev-anon').checked = false;
    document.getElementById('new-review').classList.add('hidden');
    alert('Спасибо! Отзыв отправлен — появится на сайте после проверки администратором.');
    loadReviews();
  } else alert('Не удалось отправить отзыв: ' + (r.error || 'ошибка'));
}
</script>
</body>
</html>
