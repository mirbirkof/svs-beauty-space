<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>SVS Beauty Space — запис онлайн</title>

<style>
:root{
  --bg:#141012; --card:#221c1e; --card2:#2a2326; --line:#3a3033; --text:#f4ece9; --muted:#a89a96;
  --rose:#f1b8ab; --rose2:#e7a596; --roseText:#2a1a17; --gold:#d9b38c; --ok:#7fd4a2; --err:#ff8f8f;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
:root{--topsafe:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px))}
.screen{padding:var(--topsafe) 16px 120px;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.serif{font-family:"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif}

/* головний */
.hero{position:relative;margin:calc(-1 * var(--topsafe)) -16px 0;height:calc(330px + var(--topsafe));background:#000 url(/p/miniapp/hero.jpg?v=0411hd) center 20%/cover no-repeat}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,16,18,0) 35%,rgba(20,16,18,.75) 72%,var(--bg) 100%)}
.brand{position:relative;z-index:1;text-align:center;margin-top:-118px}
.brand .svs{font-size:58px;letter-spacing:2px;color:#efe2dc;line-height:1}
.brand .bs{font-size:13px;letter-spacing:6px;color:#d8c8c2;margin-top:4px}
.brand .sub{font-size:20px;color:#e8dcd8;margin:18px 0 18px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:26px;font-weight:600;font-size:16px}
.btn-rose{background:linear-gradient(180deg,var(--rose),var(--rose2));color:var(--roseText);box-shadow:0 6px 22px rgba(241,184,171,.18)}
.btn-rose:disabled{opacity:.5}
.btn-ghost{background:var(--card);border:1px solid var(--line)}
.btn-rose .chev{margin-left:auto;margin-right:6px;font-size:20px}
.btn-rose .lbl{margin-left:30px}
.menu{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.mi{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;width:100%}
.mi .ic{width:24px;text-align:center;font-size:18px;opacity:.9}
.mi .t{flex:1}
.mi .ar,.row .ar{color:var(--muted);font-size:20px}

/* шапка кроку */
.head{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + var(--topsafe)) 0 10px;margin:calc(-1 * var(--topsafe)) 0 6px}
.head .back{position:absolute;left:-6px;top:12px;width:40px;height:40px;font-size:24px;color:var(--text)}
.head .step{text-align:center;color:var(--muted);font-size:14px}
.head .title{text-align:center;font-size:19px;margin-top:2px}
.bar{display:flex;gap:6px;margin:12px 6px 0}
.bar i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.bar i.on{background:var(--rose)}

/* списки */
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 14px 0 0;min-height:60px;text-align:left;width:100%;overflow:hidden}
.row .thumb{width:66px;height:58px;object-fit:cover;flex:none;border-radius:16px 0 0 16px}
.row .t{flex:1;font-size:16px}
.row .cnt{color:var(--muted);font-size:13px}
.svc{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.svc .t{flex:1;min-width:0;overflow-wrap:anywhere}
.svc .c{color:var(--muted);font-size:12px;margin-top:2px;opacity:.85}
.svc .n{font-size:15px}
.svc .m{color:var(--muted);font-size:13px;margin-top:3px}
.svc .p{color:var(--gold);font-weight:600;white-space:nowrap}
.svc .pn{color:var(--gold);font-size:12px;margin-top:2px;opacity:.9}
/* price-materials-0411: вибір довжини волосся (силует + см) */
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lt{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 8px 12px;color:var(--text);min-width:0}
.lt svg{width:46px;height:62px;flex:none}
.lt .cm{font-size:16px;font-weight:600}
.lt .lv{font-size:12px;color:var(--muted)}
.lt .pr{font-size:14px;color:var(--gold);font-weight:600;margin-top:2px}
.lt.on{border-color:var(--rose);background:var(--card2);box-shadow:0 0 0 1px var(--rose) inset}
.lt.unk{grid-column:1/-1;flex-direction:row;justify-content:center;gap:10px;padding:12px}
.lt.unk .cm{font-size:15px}
.lt.ty{padding:14px 8px}
.adds{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.add{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;color:var(--text);text-align:left;font-size:15px}
.add .bx{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--muted);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px}
.add.on{border-color:var(--rose)}.add.on .bx{background:var(--rose);border-color:var(--rose);color:#fff}
.add .t{flex:1}.add .ap{color:var(--gold);font-weight:600}
.lsum{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-height:62px}
.lsum .big{font-size:22px;font-weight:700;color:var(--text)}
.lsum .sm{font-size:13.5px;color:#ddd0cc;margin-top:3px}
.lsum .hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.cf .est{font-size:12.5px;color:var(--muted);margin-top:4px}
.srch{position:relative;margin:4px 0 10px}
.srch input{width:100%;box-sizing:border-box;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:16px;padding:0 40px 0 38px;outline:none;-webkit-appearance:none;appearance:none}
.srch input:focus{border-color:var(--rose)}
.srch input::placeholder{color:var(--muted)}
.srch input::-webkit-search-cancel-button{display:none}
.srch .ico{position:absolute;left:12px;top:11px;font-size:16px;opacity:.6;pointer-events:none}
.srch .clr{position:absolute;right:4px;top:3px;width:36px;height:36px;font-size:18px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;white-space:nowrap;font-size:13px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.chip.on{background:var(--rose);border-color:var(--rose);color:var(--roseText)}
.chip i{font-style:normal;color:var(--muted);margin-left:4px}
.chip.on i{color:var(--roseText);opacity:.7}
.grp{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 2px;color:var(--gold);font-size:14px;font-weight:600;letter-spacing:.2px}
.grp span{color:var(--muted);font-weight:400;font-size:12.5px}
.found{color:var(--muted);font-size:13px;margin:0 2px 2px}
.cathead{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
.cathead img{width:46px;height:46px;border-radius:12px;object-fit:cover}
.cathead b{font-size:17px;font-weight:600}

.mst{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;text-align:left;width:100%}
.mst.sel{border-color:var(--rose);box-shadow:0 0 0 1px var(--rose),0 0 22px rgba(241,184,171,.18)}
.ava{width:58px;height:58px;border-radius:50%;object-fit:cover;flex:none;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--rose)}
.mst .t{flex:1;min-width:0}
.mst .n{font-size:16px}
.mst .s{color:var(--muted);font-size:12.5px;margin-top:2px}
.mst .rt{font-size:13px;margin-top:3px}
.mst .rt b{color:var(--gold)}
.radio{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px}
.mst.sel .radio{background:var(--rose);border-color:var(--rose);color:var(--roseText)}

/* дата і час */
.weeknav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 2px;color:var(--muted);font-size:14px}
.weeknav button{width:38px;height:34px;font-size:20px;color:var(--text)}
.weeknav button:disabled{opacity:.25}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin:8px 0 18px}
.week .dw{color:var(--muted);font-size:12.5px;margin-bottom:8px}
.day{height:46px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;width:100%}
.day.off{opacity:.28}
.day.sel{background:var(--rose);color:var(--roseText);font-weight:600}
.day .dot{width:4px;height:4px;border-radius:50%;background:var(--rose);margin-top:3px}
.day.sel .dot{background:var(--roseText)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{height:44px;border-radius:22px;background:var(--card);border:1px solid var(--line);font-size:16px}
.slot.sel{background:var(--rose);border-color:var(--rose);color:var(--roseText);font-weight:600}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:22px 16px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:14px}

/* підтвердження */
.cf{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.cf img{width:92px;height:118px;object-fit:cover;border-radius:12px;flex:none}
.cf .t{flex:1;min-width:0}
.cf .n{font-size:17px;font-weight:600;margin-bottom:4px}
.cf .l{font-size:13.5px;color:#ddd0cc;margin-top:6px;display:flex;gap:8px}
.cf .l i{font-style:normal;width:18px;text-align:center;opacity:.8}
.cf .price{font-size:17px;color:var(--text);font-weight:600}
.opts{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px}
.opt .t{flex:1}
.tgl{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:.15s}
.tgl:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#f4ece9;transition:.15s}
.tgl.on{background:var(--rose)}
.tgl.on:after{left:21px}
.note{color:var(--muted);font-size:13px;margin-top:12px;text-align:center}
.fixed{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(20,16,18,0),var(--bg) 30%);z-index:6}
.fixed .inner{max-width:448px;margin:0 auto}

/* кабінет */
.hello{font-size:22px;margin:4px 0 2px}
.rate{background:var(--card,#fff);border-radius:16px;padding:14px 16px;margin:0 0 16px;box-shadow:0 2px 10px rgba(0,0,0,.06);text-align:center}
.rate .rt{font-weight:600;font-size:16px;margin-bottom:2px}
.rate .d,.hist .bon{font-size:12px;opacity:.7}
.hist .bon{color:var(--gold);opacity:1}
.stars{display:flex;justify-content:center;gap:6px;margin:10px 0 6px}
.stars .star{background:none;border:0;font-size:34px;line-height:1;color:#5a4c4f;cursor:pointer;padding:0 2px}
.stars .star.on{color:#f5b301}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:19px;color:var(--gold)}
.stat span{font-size:12px;color:var(--muted)}
h3{font-size:15px;color:var(--muted);font-weight:500;margin:20px 2px 10px;text-transform:uppercase;letter-spacing:.6px}
.ap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.ap .n{font-size:16px;font-weight:600}
.ap .m{color:#ddd0cc;font-size:13.5px;margin-top:5px}
.ap .acts{display:flex;gap:8px;margin-top:12px}
.ap .acts button{flex:1;height:40px;border-radius:20px;font-size:14px;background:var(--card2);border:1px solid var(--line)}
.ap .acts .x{color:var(--err)}
.hist{display:flex;justify-content:space-between;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14px}
.hist .d{color:var(--muted);font-size:12.5px}
.bill{margin:2px 0 12px;padding:10px 12px;background:var(--card2);border:1px solid var(--line);border-radius:14px;font-size:13.5px}
.bill .r{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.bill .r.minus span:last-child{color:var(--ok)}
.bill .tot{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:6px;padding-top:6px;font-weight:600}
.bill .tot b{color:var(--gold)}
.bill .paid{color:var(--ok);font-weight:600;margin-top:6px}
.bill .btn{margin-top:10px}

/* телефон / успіх / тости */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end}
.sheet .box{background:#1d1719;width:100%;max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet h2{font-size:19px;margin:0 0 6px}
.sheet p{color:var(--muted);margin:0 0 16px;font-size:14px}
.in{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px;padding:0 14px;margin-bottom:10px}
.or{text-align:center;color:var(--muted);font-size:13px;margin:12px 0}
.okic{width:78px;height:78px;border-radius:50%;margin:34px auto 14px;background:var(--rose);color:var(--roseText);display:flex;align-items:center;justify-content:center;font-size:40px}
.center{text-align:center}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#3a2b2e;color:var(--text);border:1px solid var(--rose);padding:12px 16px;border-radius:14px;z-index:30;max-width:90%;font-size:14px;text-align:center}
.err{color:var(--err)}
.spin{display:flex;justify-content:center;padding:40px 0}
.spin:after{content:"";width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--rose);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.badge{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:2px 8px;font-size:12px;color:var(--gold);margin-left:6px}
.cartbox{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:13.5px}
.cartbox .ci{display:flex;align-items:center;gap:8px;padding:3px 0}.cartbox .ci span{flex:1}
.cartbox .x{border:0;background:none;color:var(--muted);font-size:16px;padding:2px 6px}
.cartbox .tot{color:var(--muted);margin-top:4px}.cartbox .add{margin-top:8px;width:100%}
.mchip{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.mchip span{flex:1}.mchip i{font-style:normal;color:var(--rose)}
.banner{background:var(--card2);border:1px solid var(--rose);border-radius:14px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}

/* режим майстра (03.11, частина 2) */
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin:12px 0}
.seg button{flex:1;padding:9px 6px;border-radius:10px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--rose);color:var(--roseText)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .v{font-size:22px;font-weight:700;color:var(--text)} .kpi .k{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.wide{grid-column:1/3}
.sec{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin:18px 2px 6px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:6px 0}
.row .t1{font-weight:600} .row .t2{font-size:13px;color:var(--muted);margin-top:2px}
.row .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.row.cat{padding:0 14px 0 0;margin:0;border-radius:16px;min-height:60px}
.row.cat .t{min-width:0;overflow-wrap:anywhere}
.row .acts a,.row .acts button{font-size:13px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);color:var(--text);text-decoration:none}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:6px 0}
.mnav button{padding:6px 12px;border:1px solid var(--line);border-radius:10px}
.pick{display:block;width:100%;text-align:left;padding:12px;margin:6px 0;background:var(--card);border:1px solid var(--line);border-radius:14px}
.pick.on{border-color:var(--rose);background:var(--card2)}
</style>

<body>
<div class="app" id="app"><div class="spin"></div></div>
<script>
(function(){
'use strict';
var tg = (window.Telegram && window.Telegram.WebApp) || null;
// initData: від Telegram (WebApp.initData) або з хеша tgWebAppData, який Telegram передає в URL
function readInitData(){
  if (tg && tg.initData) return tg.initData;
  try { var h = new URLSearchParams(location.hash.slice(1)); return h.get('tgWebAppData') || ''; } catch(e){ return ''; }
}
var INIT = readInitData();
var Q = new URLSearchParams(location.search);
var CAT_IMG = [[/волос|перукар|стриж|фарб/i,'hair'],[/брів|брови|вії|вій|lash/i,'brows'],[/ніг|манік|педик|nail/i,'nails'],[/макіяж|make/i,'makeup'],[/масаж|тіл/i,'massage']];
function catImg(name){ for (var i=0;i<CAT_IMG.length;i++) if (CAT_IMG[i][0].test(name||'')) return '/p/miniapp/'+CAT_IMG[i][1]+'.jpg?v=0411hd'; return '/p/miniapp/other.jpg?v=0411hd'; }
var DW = ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
var MONN = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
var MON = ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
var DOWL = ['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];

var S = { me:null, catalog:null, cat:null, svc:null, master:null, masters:null, date:null, slot:null,
          weekStart:null, days:{}, today:null, remind24:true, move:null, stack:['home'], busy:false };

// ── утиліти ──
function h(tag, attrs){
  var el = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    var v = attrs[k]; if (v == null || v === false) continue;
    if (k === 'class') el.className = v; else if (k === 'text') el.textContent = v;
    else if (k.slice(0,2) === 'on') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (var i=2;i<arguments.length;i++) add(el, arguments[i]);
  return el;
}
function add(el, c){ if (c == null || c === false) return; if (Array.isArray(c)) c.forEach(function(x){add(el,x);}); else el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); }
function haptic(kind){ try { if (!tg || !tg.HapticFeedback) return; if (kind==='ok'||kind==='error'||kind==='warning') tg.HapticFeedback.notificationOccurred(kind); else tg.HapticFeedback.selectionChanged(); } catch(e){} }
function toast(msg){ var t = h('div',{class:'toast',text:msg}); document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 3200); }
function price(p){ p = Math.round(+p||0); return p>0 ? nf(p)+' ₴' : 'за прайсом'; }
function nf(n){ return String(Math.round(+n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,' '); }
function dur(m){ m=+m||0; var hh=Math.floor(m/60), mm=m%60; return hh ? (mm ? hh+' год '+mm+' хв' : hh+' год') : mm+' хв'; }
function lbl(min){ return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0'); }
function addDays(iso,n){ var d=new Date(iso+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function dowMon0(iso){ return (new Date(iso+'T12:00:00Z').getUTCDay()+6)%7; }
function dateLong(iso){ var d=new Date(iso+'T12:00:00Z'); return DOWL[d.getUTCDay()]+', '+d.getUTCDate()+' '+MON[d.getUTCMonth()]; }

function api(path, opts){
  opts = opts || {};
  return fetch('/api/miniapp'+path, { method: opts.method || 'GET',
    headers: Object.assign({'X-Telegram-Init-Data': INIT}, opts.body ? {'Content-Type':'application/json'} : {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined })
  .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ j._status = r.status; return j; }); });
}

// Якщо відмовився — ще раз (один) після першого запису. Ярлик уже є / не підтримується — мовчимо.

// ── пошук послуг: регістр, і/и/ї/ы, е/є/э, апострофи, рос. варіанти основних слів ──
var STEMS = [[/^(окраш|покраск|краск|фарб)/,'фарб'],[/^(ногт|нигт)/,'нигт'],[/^(наращ|нарощ)/,'нарощ'],[/^(ресниц|вии$|вия)/,'вии'],
  [/^(бров|брив)/,'бров'],[/^(кончик|кинчик)/,'кинчик'],[/^(челк|чубчик)/,'чубчик'],[/^(укладк|укладан|вкладан)/,'вкладан'],
  [/^(митт|мите|мити|мит$)/,'митт'],[/^(восстан|видновл|видновал)/,'видновл'],[/^(выпрям|випрям|виривн)/,'виривн'],
  [/^(мелир|милир)/,'мелир'],[/^масс?аж/,'масаж'],[/^(педикюр|педик)/,'педик'],[/^(маникюр|маник)/,'маник']];
function fold(t){
  return String(t||'').toLowerCase().replace(/['’`ʼ"«»]/g,'').replace(/[ьъ]/g,'').replace(/ґ/g,'г').replace(/[іїыйи]/g,'и').replace(/[еєэё]/g,'е')
    .split(/[^a-zа-я0-9]+/).filter(Boolean).map(function(w){ for (var i=0;i<STEMS.length;i++) if (STEMS[i][0].test(w)) return STEMS[i][1]; return w; });
}
function searchServices(q){
  var words = fold(q); if (!words.length) return null;
  var out = [];
  (S.catalog||[]).forEach(function(c){ c.services.forEach(function(sv){
    var nm = fold(sv.name), hay = ' '+nm.concat(fold(c.name)).join(' ');
    if (words.every(function(w){ return hay.indexOf(w) >= 0; }))
      out.push({s:sv, c:c, r: (nm[0] && nm[0].indexOf(words[0])===0) ? 0 : 1, i: out.length}); // «Стрижка…» вище за «Фарбування + стрижка»
  }); });
  return out.sort(function(a,b){ return a.r-b.r || a.i-b.i; });
}
function svcBtn(sv, c, withCat){

// ── price-materials-0411: процедура (біовирівнювання, фарбування…) → вибір довжини → робота + матеріал ──
// Послуга без довжини — одразу до майстра (жодного зайвого кроку); процедура з 1 варіантом — теж.
function openService(sv, c){

  S.cat=c; S.master=null; S.masters=null;
  if (sv.variants && sv.variants.length){
    S.proc=sv; S.variant=null; S.lenUnknown=false; S.addons=[];
    if (sv.variants.length===1){ S.variant=sv.variants[0]; pickVariant(); goTime(); return; }
    S.svc=null; go('length'); return;
  }
  S.proc=null; S.svc=sv; goTime();

// price-cards-0411: картки за прайсом салону — ціна прайсу (діапазон, топ-майстер, опції)
function isListV(v){ return v && v.list != null; }
function lsLo(v){ return v.list_top != null ? Math.min(+v.list, +v.list_top) : +v.list; }
function lsHi(v){ var a=[+(v.list_to!=null?v.list_to:v.list)]; if (v.list_top!=null) a.push(+(v.list_top_to!=null?v.list_top_to:v.list_top)); return Math.max.apply(null,a); }
function rng(lo,hi){ return lo===hi ? price(lo) : nf(lo)+'–'+price(hi); }
function addonsSum(){ var p=S.proc, n=0; ((p&&p.addons)||[]).forEach(function(a){ if ((S.addons||[]).indexOf(a.key)>=0) n+=+a.price||0; }); return n; }
function addonsTxt(){ var p=S.proc; return ((p&&p.addons)||[]).filter(function(a){ return (S.addons||[]).indexOf(a.key)>=0; }).map(function(a){ return a.label.toLowerCase()+' +'+nf(a.price); }).join(', '); }
function listSum(v, top){ // top: true — майстер топ, false — інший, undefined — ще не обраний
  var lo, hi;
  if (top===true && v.list_top!=null){ lo=+v.list_top; hi=+(v.list_top_to!=null?v.list_top_to:v.list_top); }
  else if (top===false){ lo=+v.list; hi=+(v.list_to!=null?v.list_to:v.list); }
  else { lo=lsLo(v); hi=lsHi(v); }
  var add=addonsSum(), from=(S.proc && S.proc.variant_kind==='length');
  var big = (top===undefined && v.list_top!=null ? 'від '+price(lo) : (from && lo===hi ? 'від ' : '')+rng(lo+add,hi+add));
  var sm = [];
  if (top===undefined && v.list_top!=null) sm.push('ціна залежить від майстра: '+rng(+v.list,+(v.list_to!=null?v.list_to:v.list))+', топ-майстер — '+price(+v.list_top));
  if (add) sm.push('з опціями: '+addonsTxt());
  return {big:big, sm:sm.join(' · '), lo:lo+add};
}
function variantSum(v){
  if (isListV(v)) return listSum(v);
  if (v.material_mode==='separate' && v.material_known) return {big:'≈ '+price(v.total), sm:'= робота '+nf(v.work)+' + матеріал '+nf(v.material)};
  if (v.material_mode==='extra' || !v.material_known) return {big:'≈ '+price(v.work), sm:'робота + матеріал (барвник) за фактом'};
  if (v.material_mode==='included') return {big:'≈ '+price(v.total), sm:'матеріал уже в ціні'};
  return {big:price(v.total), sm:''};
}
function unknownVariant(vs){ // бронюємо найдовший за часом — щоб майстру точно вистачило часу
  return vs.slice().sort(function(a,b){ return (b.duration_min-a.duration_min) || (b.total-a.total); })[0];
}
function rangeSum(vs){
  if (isListV(vs[0])){
    var l=Math.min.apply(null,vs.map(lsLo)), hh=Math.max.apply(null,vs.map(lsHi)), a=addonsSum();
    return {big:'від '+price(l+a), sm:'залежно від довжини: '+rng(l+a,hh+a)+(a?' · з опціями: '+addonsTxt():'')};
  }
  var t = vs.map(function(v){ return v.material_mode==='extra' ? v.work : v.total; });
  var lo = Math.min.apply(null,t), hi = Math.max.apply(null,t);
  var extra = vs.some(function(v){ return v.material_mode==='extra' || !v.material_known; });
  return {big:'≈ '+(lo===hi ? price(lo) : nf(lo)+' – '+price(hi)), sm: extra ? 'робота + матеріал за фактом' : 'залежно від довжини, робота + матеріал'};
}
function pickVariant(){
  var p=S.proc, v=S.variant; if (!p || !v) return;
  var unk = !!S.lenUnknown, sum = unk ? rangeSum(p.variants) : variantSum(v), ls = isListV(v);
  var one = p.variants.length===1 && p.variant_kind==='type';
  var adds = ls ? ((p.addons||[]).filter(function(a){ return (S.addons||[]).indexOf(a.key)>=0; }).map(function(a){ return a.key; })) : [];
  S.svc = {id:v.work_service_id, name: one ? p.name : p.name+' · '+(unk ? 'довжину визначить майстер' : (v.cm || v.label)),
    duration_min:v.duration_min, price: ls ? (unk ? Math.min.apply(null,p.variants.map(lsLo)) + addonsSum() : sum.lo) : v.work,
    variant_id:v.id, length_unknown:unk, sum:sum, list:ls, lv:v, hint: ls ? (p.price_hint||'') : '', addons:adds,
    top_ids:(ls && v.list_top!=null) ? (p.top_master_ids||[]) : [], top_service_id: v.work_service_top_id || null,
    est: ls ? (unk || p.variant_kind==='length') : (v.material_mode!=='none' || unk)};
  S.master=null; S.masters=null;
}
function hairSvg(level){
  var y = 26 + Math.min(6, Math.max(1, +level||3)) * 5.4;      // нижній край волосся: 1 — коротко, 6 — до пояса
  return '<svg viewBox="0 0 46 62" aria-hidden="true">'
    + '<path d="M8 62c0-11 7-16 15-16s15 5 15 16z" fill="#3a3033"/>'
    + '<path d="M23 6c-9 0-14 6-14 14v'+(y-20).toFixed(1)+'c0 2 2 3 4 2l2-1V20c2-3 5-5 8-5s6 2 8 5v'+(y-21).toFixed(1)+'l2 1c2 1 4 0 4-2V20c0-8-5-14-14-14z" fill="#d9b38c"/>'
    + '<ellipse cx="23" cy="21" rx="7.5" ry="9" fill="#f1d6cb"/></svg>';
}
function vLength(){
  var p = S.proc; if (!p) return back();
  var vs = p.variants, uv = unknownVariant(vs), isType = p.variant_kind==='type';
  var sum = h('div',{class:'lsum',id:'len-sum'});
  var next = h('button',{class:'btn btn-rose',id:'next-length',disabled:!S.variant,onclick:function(){ haptic(); pickVariant(); goTime(); }}, 'Далі — час ›');
  var grid = h('div',{class:'lgrid'});
  var adds = h('div',{class:'adds'}, (p.addons||[]).length ? h('div',{class:'sm',style:'color:var(--muted);font-size:13px',text:'Додатково (за бажанням):'}) : null,

// телефон питаємо один раз: кнопкою Telegram (підписаний контакт) або вручну
function ensurePhone(force, why){
  if (!force && S.me && S.me.client && S.me.client.has_phone) return Promise.resolve(true);
  return new Promise(function(resolve){
    var inp = h('input',{class:'in',type:'tel',inputmode:'tel',placeholder:'+380 XX XXX XX XX',id:'phone-in',autocomplete:'tel'});
    var nm = h('input',{class:'in',type:'text',placeholder:'Ваше імʼя',value:(tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name)||''});
    var msg = h('div',{class:'note err'});
    function close(v){ sh.remove(); resolve(v); }
    function done(j){
      if (j._status===200 && j.ok){ S.me = S.me || {}; S.me.client = Object.assign({}, S.me.client||{}, {has_phone:true});
        if (j.master && j.master.is_master) { S.me.master = j.master; toast('Вас упізнано як майстра: '+j.master.name); }
        close(true); hsOfferOnce(); refreshMe(); return; }
      // картка клієнта зайнята іншим Telegram, але номер — майстра салону: режим майстра все одно вмикається
      if (j.master && j.master.is_master) { S.me = S.me || {}; S.me.master = j.master; toast('Вас упізнано як майстра: '+j.master.name); close(true); refreshMe(); return; }
      msg.textContent = j.message || 'Не вдалося зберегти номер';
    }
    var share = (tg && tg.requestContact) ? h('button',{class:'btn btn-rose',id:'share-phone',onclick:function(){
      haptic();
      try { tg.requestContact(function(ok, resp){
        if (!ok) { msg.textContent='Можна ввести номер вручну нижче.'; return; }
        var raw = resp && (resp.response || (typeof resp==='string'?resp:null));
        if (!raw) { msg.textContent='Telegram не передав номер, введіть вручну.'; return; }
        api('/contact',{method:'POST',body:{contact:raw}}).then(done);
      }); } catch(e){ msg.textContent='Введіть номер вручну.'; }
    }}, '📱 Поділитися номером з Telegram') : null;
    var sh = h('div',{class:'sheet'}, h('div',{class:'box'},
      h('h2',{text:'Ваш номер телефону'}), h('p',{text: why || 'Потрібен один раз — щоб салон міг звʼязатися щодо запису.'}),
      share, (share && !force) ? h('div',{class:'or',text:'або'}) : null, force ? null : nm, force ? null : inp,
      force ? null : h('button',{class:'btn btn-ghost',id:'save-phone',onclick:function(){
        api('/contact',{method:'POST',body:{phone:inp.value, name:nm.value}}).then(done); }}, 'Зберегти номер'),
      msg, h('button',{class:'btn',style:'margin-top:6px;color:var(--muted)',onclick:function(){ close(false); }}, 'Скасувати')));
    document.body.appendChild(sh);
  });
}

// 04.11 Картка «Оцініть візит»: 5 зірок майстру. Одна оцінка на візит, змінити можна протягом 24 год.
function rateCard(a){
  var card = h('div',{class:'rate','data-rate':a.id});
  var title = h('div',{class:'rt',text: a.rating ? 'Ваша оцінка візиту' : 'Оцініть візит'});
  var sub = h('div',{class:'d',text:a.service+' · '+a.master+' · '+a.date_label});
  var row = h('div',{class:'stars'});
  var note = h('div',{class:'d',text: a.rating ? 'Змінити оцінку можна протягом 24 годин.' : 'Торкніться зірки — це допомагає нам ставати кращими 💛'});
  function paint(n){ Array.prototype.forEach.call(row.children, function(b,i){ b.classList.toggle('on', i<n); }); }
  [1,2,3,4,5].forEach(function(n){
    row.appendChild(h('button',{class:'star','data-n':n,'aria-label':n+' з 5',onclick:function(){
      haptic(); paint(n);
      api('/appointments/'+a.id+'/rate',{method:'POST',body:{stars:n}}).then(function(j){
        if (j._status===200){ a.rating = n; title.textContent = 'Дякуємо за оцінку!'; note.textContent = 'Змінити оцінку можна протягом 24 годин.'; toast('Оцінку збережено'); }
        else { paint(a.rating||0); haptic('error'); toast(j.message||'Не вдалося зберегти оцінку'); }
      }).catch(function(){ paint(a.rating||0); toast('Немає звʼязку. Спробуйте ще раз.'); });
    }}, '★'));
  });
  paint(a.rating||0);
  card.appendChild(title); card.appendChild(sub); card.appendChild(row); card.appendChild(note);
  return card;
}
// 04.11 Рахунок візиту (послуги + товари − знижки) і оплата Apple Pay / Google Pay через monobank.
function billMoney(v){ v=Math.round((+v||0)*100)/100; return (v%1 ? v.toFixed(2).replace('.',',') : String(v)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' грн'; }
function billCard(a){
  var b = a.bill, card = h('div',{class:'bill','data-bill':a.id});
  (b.lines||[]).forEach(function(l){ card.appendChild(h('div',{class:'r'+(l.amount<0?' minus':'')}, h('span',{text:l.label}), h('span',{text:(l.amount<0?'−':'')+billMoney(Math.abs(l.amount))}))); });
  if (b.paid) { card.appendChild(h('div',{class:'paid',text:'✅ Оплачено'})); return card; }
  card.appendChild(h('div',{class:'tot'}, h('span',{text:'Рахунок'}), h('b',{text:billMoney(b.amount)})));
  if (b.can_pay) card.appendChild(h('button',{class:'btn btn-rose',onclick:function(e){ payBill(a, e.currentTarget); }}, 'Оплатити '+billMoney(b.amount)+' ·  Apple Pay / Google Pay'));
  return card;
}
function payBill(a, btn){

  api('/appointments/'+a.id+'/pay',{method:'POST'}).then(function(j){
    btn.disabled = false; btn.textContent = t;

// ── режим майстра (Босс 04.11: визначається автоматично) ──
// Права майстра дає лише номер, яким поділились кнопкою Telegram (підписаний контакт) і який збігся з працюючим
// майстром у CRM. Окремої кнопки «Я майстер салону» немає. Звільнили — сервер віддасть is_master:false.
// Сесія — звичайний токен CRM ролі «Майстер», тримається лише в памʼяті сторінки.
function isMaster(){ return !!(S.me && S.me.master && S.me.master.is_master); }
function modeSwitch(cur){
  if (!isMaster()) return null;
  return h('div',{class:'seg',id:'mode-seg'},
    h('button',{class:cur==='client'?'on':'',id:'mode-client',onclick:function(){ haptic(); if (cur!=='client') home(); }}, '👤 Я клієнт'),
    h('button',{class:cur==='master'?'on':'',id:'mode-master',onclick:function(){ haptic(); if (cur!=='master') { S.stack=['home','master']; show(); } }}, '✂️ Я майстер'));
}
function mapi(path, opts){
  opts = opts || {};
  function call(){ return fetch('/api/me'+path, { method: opts.method || 'GET',
      headers: Object.assign({'Authorization':'Bearer '+S.mtoken}, opts.body ? {'Content-Type':'application/json'} : {}),
      body: opts.body ? JSON.stringify(opts.body) : undefined })
    .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ j._status = r.status; return j; }); }); }
  function sess(){ return api('/master/session',{method:'POST',body:{}}).then(function(j){
    // 04.11: майстра звільнили / відвʼязали — сервер більше не дає сесію → тихо переходимо в режим клієнта
    if (j._status===403) { S.mtoken=null; if (S.me) S.me.master={is_master:false}; toast('Режим майстра вимкнено — ви в режимі клієнта'); home(); }
    if (j._status!==200) throw j; S.mtoken=j.token; }); }
  return (S.mtoken ? Promise.resolve() : sess()).then(call).then(function(j){
    if (j._status===401 && !opts._retry) { S.mtoken=null; opts._retry=true; return sess().then(call); }
    return j; });
}
function money(v){ return Math.round(+v||0).toLocaleString('uk-UA').replace(/ /g,' ')+' грн'; }
function kpi(v, k, wide, id){ return h('div',{class:'kpi'+(wide?' wide':''),id:id||null}, h('div',{class:'v',text:String(v)}), h('div',{class:'k',text:k})); }
function hm(iso){ var d=new Date(iso); return d.toLocaleTimeString('uk-UA',{timeZone:'Europe/Kyiv',hour:'2-digit',minute:'2-digit'}); }
var STLBL = {booked:'записаний', confirmed:'підтверджено', done:'відбувся', completed:'відбувся', cancelled:'скасовано', noshow:'не прийшов'};
function monthShift(m, n){ var y=+m.slice(0,4), mo=+m.slice(5,7)-1+n; y+=Math.floor(mo/12); mo=((mo%12)+12)%12; return y+'-'+String(mo+1).padStart(2,'0'); }
function vMaster(){
  if (!isMaster()) { home(); return; }
  var box = h('div',{id:'mstats'}, h('div',{class:'spin'}));
  var todayBox = h('div',{id:'mtoday'});
  render(h('div',{class:'screen'}, plainHead('Кабінет майстра'), modeSwitch('master'),
    h('div',{class:'hello',text:'✂️ '+(S.me.master.name||'Майстер')}), box,
    h('div',{class:'sec',text:'Клієнти сьогодні'}), todayBox));
  loadStats(box, S.mmonth || null);
  loadToday(todayBox);
}
function loadStats(box, month){
  mapi('/stats'+(month?'?month='+month:'')).then(function(j){
    box.innerHTML='';
    if (j._status!==200) { add(box, h('div',{class:'note err',text: j.message || 'Немає доступу до кабінету майстра'})); return; }
    S.mmonth = j.month;
    var ld = j.load.pct==null ? '—' : j.load.pct+'%';
    add(box, [
      h('div',{class:'sec',text:'Записи'}),
      h('div',{class:'kpis'}, kpi(j.upcoming.today,'сьогодні',0,'k-today'), kpi(j.upcoming.tomorrow,'завтра'), kpi(j.upcoming.week,'на 7 днів',1)),
      h('div',{class:'mnav'},
        h('button',{onclick:function(){ loadStats(box, monthShift(j.month,-1)); }}, '‹'),
        h('div',{class:'sec',style:'margin:0',text:'Місяць '+j.month}),
        h('button',{onclick:function(){ loadStats(box, monthShift(j.month,1)); }, disabled: j.current ? true : null}, '›')),
      h('div',{class:'kpis'},
        kpi(money(j.money.earned),'мій заробіток'+(j.current?' (поки що)':''),0,'k-earned'), kpi(money(j.money.revenue),'виручка послуг',0,'k-revenue'),
        kpi(j.visits,'візитів'+(j.services && j.services!==j.visits ? ' · '+j.services+' послуг' : ''),0,'k-visits'), kpi(money(j.avg_check),'середній чек'),
        kpi(j.new_clients,'нових клієнтів'), kpi(j.repeat_clients,'повторних'),
        kpi(ld,'завантаження графіка'), kpi(j.cancelled+' / '+j.noshow,'скасування / неявки'),
        kpi(j.reviews.count ? ('★ '+j.reviews.avg+' ('+j.reviews.count+')') : 'ще немає','відгуки',1))
    ]);
    (j.reviews.last||[]).forEach(function(r){ add(box, h('div',{class:'row'}, h('div',{class:'t1',text:'★'.repeat(r.rating)+' · '+r.d}), r.text ? h('div',{class:'t2',text:r.text}) : null)); });
  }).catch(function(){ box.innerHTML=''; add(box, h('div',{class:'note err',text:'Не вдалося завантажити статистику'})); });
}
function loadToday(box){
  mapi('/today').then(function(j){
    box.innerHTML='';
    if (j._status!==200) return;
    if (!j.items.length) { add(box, h('div',{class:'note',text:'Сьогодні записів немає'})); return; }
    j.items.forEach(function(a){
      var acts = h('div',{class:'acts'});
      if (a.phone && !j.masked) add(acts, h('a',{href:'tel:'+a.phone}, '📞 '+a.phone));
      else if (a.phone) add(acts, h('span',{class:'t2',text:a.phone}));
      if (a.tg_username) add(acts, h('a',{href:'https://t.me/'+a.tg_username}, '✈️ Telegram'));
      if (a.can_noshow) add(acts, h('button',{class:'ns',onclick:function(){ markNoshow(a.id, false, box); }}, '🚫 Не прийшов'));
      if (a.status==='noshow') add(acts, h('button',{onclick:function(){ markNoshow(a.id, true, box); }}, '↩︎ Прийшов (скасувати)'));
      add(box, h('div',{class:'row'},
        h('div',{class:'t1',text:hm(a.starts_at)+' — '+a.client}),
        h('div',{class:'t2',text:(a.service||'')+' · '+(STLBL[a.status]||a.status)+(a.paid?' · оплачено':'')}), acts));
    });
  });
}
function markNoshow(id, undo, box){
  haptic();
  mapi('/appointments/'+id+'/noshow',{method:'POST',body:{undo:!!undo}}).then(function(j){
    if (j._status===200) { toast(undo?'Повернули запис':'Позначено: не прийшов'); loadToday(box); }
    else toast(j.message||'Не вдалося');
  });
}
function boot(){
  if (tg){ try { tg.ready(); tg.expand();
    // 04.11 Босс: «зроби повноекранним» — Bot API 8.0 fullscreen; свайп вниз не закриває застосунок посеред скролу
    try { if (tg.isVersionAtLeast && tg.isVersionAtLeast('8.0') && tg.requestFullscreen && !tg.isFullscreen) tg.requestFullscreen(); } catch(e){}
    try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch(e){} tg.setHeaderColor && tg.setHeaderColor('#141012'); tg.setBackgroundColor && tg.setBackgroundColor('#141012');
    tg.BackButton && tg.BackButton.onClick(back); } catch(e){} }
  if (!INIT){
    render(h('div',{class:'screen center'}, h('div',{class:'hero'}),
      h('div',{class:'brand'}, h('div',{class:'svs serif',text:'SVS'}), h('div',{class:'bs serif',text:'BEAUTY SPACE'}),
        h('div',{class:'sub',text:'Відкрийте запис через нашого Telegram-бота'})),
      h('a',{class:'btn btn-rose',href:'https://t.me/Svs_beautybot',style:'text-decoration:none'}, 'Відкрити @Svs_beautybot')));
    return;
  }
  api('/me').then(function(j){
    if (j._status===401){ render(h('div',{class:'screen center'}, h('div',{class:'okic',text:'!'}),
      h('div',{class:'hello',text:'Сесія застаріла'}), h('div',{class:'note',text:'Закрийте і відкрийте застосунок знову з чату бота.'}))); return; }
    S.me = j;
    var mv = Q.get('move'), scr = Q.get('screen');
    if (mv) { S.stack=['home','cabinet']; startMove(mv.split(/[.,]/)); return; }
    if (scr==='cabinet') { S.stack=['home','cabinet']; show(); return; }
    if (scr==='book') { startBooking(); return; }
    if (scr==='master' && isMaster()) { S.stack=['home','master']; show(); return; }
    show();
    // Мʼяко просимо номер у тих, хто ще не поділився (раз на добу, можна закрити)
    try {
      var k='svs_phone_ask', last=+localStorage.getItem(k)||0;
      if (j.client && !j.client.has_phone || !j.client) { if (Date.now()-last > 864e5) setTimeout(function(){
        if (S.stack.length!==1 || S.stack[0]!=='home' || document.querySelector('.sheet')) return; // клієнт уже пішов записуватись — номер попросимо при підтвердженні
        localStorage.setItem(k, Date.now());
        ensurePhone(false).then(function(){ if (S.stack.length===1) show(); }); }, 900); }
    } catch(e){}
  }).catch(function(){ render(h('div',{class:'screen center'}, h('div',{class:'hello',text:'Немає звʼязку'}),
    h('button',{class:'btn btn-rose',onclick:boot}, 'Спробувати ще раз'))); });
}
boot();
})();
</script>
